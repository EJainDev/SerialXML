name: Build and Test

on:
  push:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - '.devcontainer/**'
      - 'README.md'
      - 'include/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'examples/**'
      - 'benchmarks/**'

  pull_request:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - '.devcontainer/**'
      - 'README.md'
      - 'include/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'examples/**'
      - 'benchmarks/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -eu
            cmake --preset release-test-gcc
            cmake --build --preset build-release-test
            ctest --test-dir build/release --output-on-failure --no-tests=error --output-junit test-results.xml
            cmake -DSERIAL_XML_SOURCE_DIR="$PWD" -DSERIAL_XML_BINARY_DIR="$PWD/build/release" -P tests/consumer/run.cmake
      
      - name: Test Report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: C++ Tests
          path: build/release/test-results.xml
          reporter: java-junit
          fail-on-error: true
          list-tests: failed
          list-suites: failed
          max-annotations: 50