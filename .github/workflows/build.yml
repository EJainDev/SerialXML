name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            cmake --preset release-test-gcc
            cmake --build --preset release-test-gcc