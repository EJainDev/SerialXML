name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
      - 'include/**'
      - 'examples/**'
      - 'assets/**'
      - 'LICENSE'
      - 'README.md'
  pull_request:
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
      - 'include/**'
      - 'examples/**'
      - 'assets/**'
      - 'LICENSE'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -b html -n -W --keep-going docs build/docs/html
