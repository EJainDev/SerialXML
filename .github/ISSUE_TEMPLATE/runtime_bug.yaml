name: "Runtime Bug Report"
title: "[Bug]: "
description: Report a runtime error or unexpected behavior.
labels: ["bug", "runtime-error"]
body:
  - type: markdown
    attributes:
      value: "## Runtime Bug Report"
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened
      description: "Describe the unexpected behavior."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What Should Have Happened
      description: "Describe the expected behavior."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproducing Example
      description: "Provide a minimal, self-contained code snippet."
      render: cpp
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Potential Cause (Optional)
      description: "Any hypotheses on why this might be happening."
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
